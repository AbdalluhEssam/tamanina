name: tamanina
description: A new Flutter project with Clean Architecture by Abdalluh Essam
# Flutter version on machine: 3.29.3
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc:
  dio:
  shared_preferences:
  easy_localization:
  intl:
  equatable:
  get_it:
  cached_network_image:
  flutter_screenutil:
  flutter_animate:
  freezed_annotation:
  json_annotation:
  flutter_native_splash:
  animate_do:
  lottie:
  google_fonts:
  flutter_launcher_icons:
  animator:
  dartz:
  flutter_svg:
  cupertino_icons:
  # New dependencies for Tamanina features
  supabase_flutter: ^2.3.4
#  firebase_core: ^2.24.2
#  firebase_messaging: ^14.7.10
#  flutter_local_notifications: ^17.2.2
  in_app_review: ^2.0.9
  package_info_plus: ^4.2.0
  permission_handler: ^11.3.1
  geolocator: ^10.1.0
  http: ^1.1.2
  # UI Enhancement Dependencies
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.1.0
  flutter_staggered_animations: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner:
  freezed:
  json_serializable:
  bloc_test:
  mockito:
  flutter_lints:

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/lang/
    - assets/data/
