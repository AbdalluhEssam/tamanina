name: tamanina
description: A new Flutter project with Clean Architecture by Abdalluh Essam

version: 1.0.0+1
# Flutter version on machine: 3.29.3
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc:
  dio:
  shared_preferences:
  easy_localization:
  intl:
  equatable:
  get_it:
  cached_network_image:
  flutter_screenutil:
  flutter_animate:
  freezed_annotation:
  json_annotation:
  flutter_native_splash:
  animate_do:
  lottie:
  google_fonts:
  flutter_launcher_icons:
  animator:
  dartz:
  flutter_svg:
  cupertino_icons:
  # New dependencies for Tamanina features
  supabase_flutter: ^2.3.4
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.10
  flutter_local_notifications: ^17.2.2
  firebase_remote_config: ^4.3.8
  timezone: ^0.9.2
  url_launcher: ^6.2.4
  in_app_review: ^2.0.9
  package_info_plus: ^4.2.0
  permission_handler: ^11.3.1
  geolocator: ^10.1.0
  http: ^1.1.2
  # UI Enhancement Dependencies
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.1.0
  flutter_staggered_animations: ^1.1.1
  share_plus: ^7.2.1
  # Quran Library for complete Quran features
  quran_sharif: ^1.0.0
  just_audio: ^0.10.5
  # Prayer Times - Accurate calculation using adhan algorithm
  adhan: ^2.0.0
  # Compass for Qibla direction
  flutter_compass: ^0.8.0
  # Audio playback for Adhan
  audio_session: ^0.1.21
  # Geocoding for location names
  geocoding: ^3.0.0
  # Hijri calendar
  hijri: ^3.0.0
  # Hive for fast local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # Path provider for file storage
  path_provider: ^2.1.4
  # UUID for unique identifiers
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner:
  freezed:
  json_serializable:
  bloc_test:
  mockito:
  flutter_lints:
  hive_generator: ^2.0.1
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/lang/
    - assets/data/
    - assets/data/adhkar/
    - assets/audio/
    - assets/audio/adhan/
